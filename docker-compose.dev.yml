# Infra only, with ports on localhost, for running a backend straight from source:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis migrate jaeger
#   docker compose --profile testbed -f docker-compose.yml -f docker-compose.dev.yml up -d testbed
services:
  postgres:
    ports: ["5432:5432"]
  redis:
    ports: ["6379:6379"]
  jaeger:
    ports: ["16686:16686", "4318:4318"]
