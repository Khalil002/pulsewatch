# One-command deploy:   docker compose up --build
# Pick a backend:       BACKEND=express docker compose up --build   (spring | express | dotnet)
# Scale it out:         docker compose up --build --scale api=3
# Demo targets:         docker compose --profile testbed up --build
name: pulsewatch

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pulsewatch}
      POSTGRES_USER: ${DB_ADMIN_USER:-pulsewatch}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-pulsewatch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Applies db/migrations as the owner, and creates the restricted pulsewatch_app role
  # that the backends use (row-level security applies to it).
  migrate:
    image: flyway/flyway:10-alpine
    command: >-
      -url=jdbc:postgresql://postgres:5432/${DB_NAME:-pulsewatch}
      -user=${DB_ADMIN_USER:-pulsewatch} -password=${DB_ADMIN_PASSWORD:-pulsewatch}
      -placeholders.appPassword=${APP_DB_PASSWORD:-pulsewatch_app}
      -locations=filesystem:/flyway/sql -connectRetries=20 migrate
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backends/${BACKEND:-spring}
    environment:
      PORT: "8000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-pulsewatch}
      DB_USER: pulsewatch_app
      DB_PASSWORD: ${APP_DB_PASSWORD:-pulsewatch_app}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-of-32-bytes}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      RATE_LIMIT_WINDOW_SEC: ${RATE_LIMIT_WINDOW_SEC:-60}
      CACHE_TTL_SEC: ${CACHE_TTL_SEC:-5}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      # Traces go to Jaeger. Set OTEL_EXPORTER_OTLP_ENDPOINT= (empty) to turn tracing off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4318}
      OTEL_SERVICE_NAME: pulsewatch-${BACKEND:-spring}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Static UI + reverse proxy for /api. /metrics on the api replicas is not exposed here.
  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  # Scrapes /metrics from every api replica (found through Docker DNS).
  prometheus:
    image: prom/prometheus:v2.55.1
    command: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=7d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pulsewatch.json
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_PORT:-16686}:16686"

  # Fake HTTP targets and webhook receivers for demos and the contract tests.
  testbed:
    profiles: [testbed]
    build: ./scripts/testbed
    ports:
      - "${TESTBED_PORT:-9000}:9000"

volumes:
  pgdata:
